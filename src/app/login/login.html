<div class="auth-container">
  <div class="auth-card">
    <h1>Login</h1>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" [ngModel]="username()" (ngModelChange)="username.set($event)" autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" autocomplete="current-password" />
      </div>

      @if (error()) {
        <div class="error">{{ error() }}</div>
      }

      <button type="submit" class="btn">Sign In</button>
    </form>
    <p class="hint">Demo: use any non-empty username/password</p>
  </div>
</div>
